name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build RVP patch bundle
        run: make rvp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Publish rolling release
        run: |
          if gh release view main >/dev/null 2>&1; then
            gh release upload main patches/build/libs/vk-video-patches.rvp --clobber
            gh release edit main --title "main" --notes "Commit: ${{ github.sha }}"
          else
            gh release create main patches/build/libs/vk-video-patches.rvp \
              --title "main" \
              --notes "Commit: ${{ github.sha }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
